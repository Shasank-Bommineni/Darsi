name: Acquire Darsi geodata

on:
  workflow_dispatch:
    inputs:
      half_km:
        description: "Half-width of the OSM window in km"
        default: "4.2"

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pillow
      - name: Fetch OpenStreetMap extract (ODbL)
        run: python tools/fetch_osm.py --output data/osm/darsi_osm.json --half-km ${{ github.event.inputs.half_km || '4.2' }}
      - name: Fetch SRTM-derived elevation
        run: python tools/fetch_dem.py --output data/dem/darsi_dem.npz --half-km 5.2 --zoom 13
      - name: Summary
        run: |
          python - <<'PY'
          import json, numpy as np, pathlib
          o = json.loads(pathlib.Path("data/osm/darsi_osm.json").read_text())
          print("osm elements:", len(o["elements"]))
          from collections import Counter
          c = Counter()
          for e in o["elements"]:
              for k in (e.get("tags") or {}):
                  c[k] += 1
          print(c.most_common(30))
          d = np.load("data/dem/darsi_dem.npz")
          h = d["heights"]
          print("dem", h.shape, float(h.min()), float(h.max()), float(h.mean()))
          print(json.loads(str(d["meta"])))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/osm/darsi_osm.json data/dem/darsi_dem.npz
          git commit -m "data: real OSM extract + SRTM elevation for Darsi [skip ci]" || echo "no changes"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: darsi-geodata
          path: |
            data/osm/darsi_osm.json
            data/dem/darsi_dem.npz
