name: Fetch Darsi OpenStreetMap data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download the Overpass extract for Darsi
        run: python tools/fetch_darsi_osm.py --output data/osm/darsi_raw.json

      - name: Build the runtime world manifest
        run: python tools/build_world.py --input data/osm/darsi_raw.json --output data/darsi_world.json

      - name: Render the verification map
        run: python tools/render_map.py --input data/darsi_world.json --output docs/darsi_map_preview.svg

      - name: Summary
        run: |
          python - <<'PY'
          import json, pathlib
          w = json.loads(pathlib.Path("data/darsi_world.json").read_text())
          print(json.dumps(w["stats"], indent=2)[:4000])
          PY

      - name: Commit the data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/osm/darsi_raw.json data/darsi_world.json docs/darsi_map_preview.svg
          git commit -m "data: import real OpenStreetMap extract for Darsi (ODbL)" || echo "no changes"
          git push origin HEAD:${{ github.ref_name }}
