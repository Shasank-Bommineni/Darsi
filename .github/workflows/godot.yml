name: Build and test the Godot project

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate the world manifest
        run: python tests/test_world_manifest.py 2>&1 | tee -a ci.log

      - name: Install Godot ${{ env.GODOT_VERSION }} (headless)
        run: |
          set -e
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          godot --version | tee -a ci.log

      - name: Import the project
        run: |
          godot --headless --import --quit-after 600 2>&1 | tail -40 | tee -a ci.log || true

      - name: Check every script
        id: parse
        continue-on-error: true
        run: |
          echo "=== script checks ===" >> ci.log
          status=0
          for f in scripts/*.gd tests/headless_test.gd; do
            echo "--- $f" >> ci.log
            if ! godot --headless --check-only --script "$f" >> ci.log 2>&1; then
              echo "CHECK FAILED: $f" >> ci.log
              status=1
            fi
          done
          exit $status

      - name: Run the headless acceptance tests
        id: tests
        continue-on-error: true
        run: |
          echo "=== headless acceptance tests ===" >> ci.log
          set -o pipefail
          godot --headless --script tests/headless_test.gd 2>&1 | grep -v 'Parameter "m" is null' | grep -v 'mesh_storage.h' | tee -a ci.log | tail -80
          grep -q "0 failures" ci.log

      - name: Smoke-run the real game scene
        id: smoke
        continue-on-error: true
        run: |
          echo "=== smoke run ===" >> ci.log
          timeout 180 godot --headless --quit-after 600 scenes/main.tscn 2>&1 | grep -v 'Parameter "m" is null' | grep -v 'mesh_storage.h' | tee -a ci.log | tail -40 || true
          grep -q "Darsi built:" ci.log

      - name: Render verification screenshots
        id: shots
        continue-on-error: true
        run: |
          echo "=== screenshots ===" >> ci.log
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils >/dev/null
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          timeout 600 xvfb-run -a --server-args="-screen 0 1280x720x24" \
            godot --rendering-driver opengl3 --resolution 1280x720 --position 0,0 scenes/capture.tscn 2>&1 \
            | grep -v 'Parameter "m" is null' | tee -a ci.log | tail -30
          ls -la docs/screenshots | tee -a ci.log

      - name: Export the Linux build
        id: export
        continue-on-error: true
        run: |
          echo "=== export ===" >> ci.log
          mkdir -p build/linux
          godot --headless --export-release "Linux/X11" build/linux/darsi.x86_64 2>&1 | tail -30 | tee -a ci.log
          ls -la build/linux | tee -a ci.log
          test -s build/linux/darsi.x86_64

      - name: Publish the CI log back to the branch
        if: always()
        run: |
          mkdir -p .ci
          {
            echo "# Last CI run"
            echo
            echo "commit: ${{ github.sha }}"
            echo "parse: ${{ steps.parse.outcome }}  tests: ${{ steps.tests.outcome }}  smoke: ${{ steps.smoke.outcome }}  export: ${{ steps.export.outcome }}"
            echo
            echo '```'
            grep -v 'Parameter "m" is null' ci.log | grep -v 'mesh_storage.h' | tail -c 150000
            echo '```'
          } > .ci/last-run.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .ci/last-run.md
          git add -f docs/screenshots/*.png 2>/dev/null || true
          git commit -m "ci: publish run log [skip ci]" || echo "no change"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || echo "push failed"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: darsi-build
          path: |
            build/
            ci.log

      - name: Fail if any stage failed
        if: steps.parse.outcome != 'success' || steps.tests.outcome != 'success' || steps.smoke.outcome != 'success' || steps.export.outcome != 'success'
        run: |
          echo "parse=${{ steps.parse.outcome }} tests=${{ steps.tests.outcome }} smoke=${{ steps.smoke.outcome }} export=${{ steps.export.outcome }}"
          exit 1
