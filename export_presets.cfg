; Godot Android export preset. Configure a local debug keystore in the Godot editor
; before shipping a signed APK/AAB. No private signing material belongs in this repository.
[preset.0]
name="Darsi Android"
platform="Android"
runnable=true
custom_features=""
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter=""
patch_list=PackedStringArray()

[preset.0.options]
custom_template/debug=""
custom_template/release=""
apk_package_name="com.darsiride.smalltown"
apk_version_code=1
apk_version_name="0.1.0"
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
screen/immersive_mode=true
screen/orientation=1
version/code=1
version/name="0.1.0"
launcher_icons/main_192x192="res://icon.svg"
launcher_icons/adaptive_foreground_432x432="res://icon.svg"
launcher_icons/adaptive_background_432x432="res://icon.svg"
permissions/internet=false

; Desktop preset used by CI to prove the project actually exports.
[preset.1]
name="Linux/X11"
platform="Linux/X11"
runnable=true
custom_features=""
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="data/osm/*"
export_path="build/linux/darsi.x86_64"
patch_list=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false
